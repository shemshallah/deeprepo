name: 02 test
# Offline correctness gate: dequant vs ggml reference, GGUF, tokenizer, sparse tiers,
# engine-vs-dense logits, KV-in-reporam, handoff continuity, trimmed compaction.
# No secrets, no network, no model — safe to run anywhere.
on:
  workflow_dispatch:
  push:
    paths:
      - "deepcore/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/02-test.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-core.txt
      - name: Run offline suite
        run: python tests/run_all.py
      - name: Dequant cross-check against ggml C
        run: |
          echo "Dequant reference ports are in tests/test_dequant.py (Q4_K/Q5_K/Q6_K/Q8_0/F16)." >> "$GITHUB_STEP_SUMMARY"
