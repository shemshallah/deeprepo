name: 07 batch ring
# One independent turn per slot: up to five conversations at once, local KV per runner,
# no shared journal writes. Use when 05-serve is idle (both may answer the same issue).
on:
  workflow_dispatch:
    inputs:
      limit:
        description: max issues (one per ring slot)
        type: string
        default: "5"
      model:
        description: model key (empty = CHAT_MODEL / active)
        type: string
        default: ""
      max_tokens:
        description: reply cap per issue
        type: string
        default: "48"

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_RAM: ${{ vars.REPORAM_REPO || format('{0}/reporam', github.repository_owner) }}
  DEEPREPO_VRAM: ${{ vars.REPOVRAM_REPO || format('{0}/repovram', github.repository_owner) }}
  DEEPREPO_MAIN: ${{ github.repository }}
  DEEPREPO_RAM_BACKEND: ${{ vars.RAM_BACKEND || 'github' }}
  DEEPREPO_VRAM_BACKEND: ${{ vars.VRAM_BACKEND || 'github' }}
  DEEPREPO_MIDDLE_URL: ${{ vars.MIDDLE_URL }}
  DEEPREPO_MIDDLE_TOKEN: ${{ secrets.MIDDLE_TOKEN }}
  CHAT_MODEL: ${{ vars.CHAT_MODEL }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-core.txt
      - name: Dispatch pending issues to the ring
        run: |
          python -m deepcore batch --limit "${{ inputs.limit }}" \
            --model "${{ inputs.model }}" --max-tokens "${{ inputs.max_tokens }}" | tee batch.json
      - name: Summary
        run: |
          { echo "## Batch dispatch"; echo '```json'; cat batch.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
