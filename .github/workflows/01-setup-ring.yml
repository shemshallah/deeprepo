name: 01 setup ring
# Verifies deeprepo-cpu-1..5 exist with the runner workflow, self-tests every slot,
# and records ring health in the reporam registers. Run BEFORE loading the model.
on:
  workflow_dispatch:
    inputs:
      op:
        description: selftest (no model needed) or prewarm (requires loaded model)
        type: choice
        options: [selftest, prewarm]
        default: selftest

permissions:
  contents: read

concurrency: ring-setup

env:
  GH_TOKEN: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_RAM: ${{ vars.REPORAM_REPO || format('{0}/reporam', github.repository_owner) }}
  DEEPREPO_VRAM: ${{ vars.REPOVRAM_REPO || format('{0}/repovram', github.repository_owner) }}
  DEEPREPO_MAIN: ${{ github.repository }}
  DEEPREPO_RAM_BACKEND: ${{ vars.RAM_BACKEND || 'github' }}
  DEEPREPO_VRAM_BACKEND: ${{ vars.VRAM_BACKEND || 'github' }}
  DEEPREPO_MIDDLE_URL: ${{ vars.MIDDLE_URL }}
  DEEPREPO_MIDDLE_TOKEN: ${{ secrets.MIDDLE_TOKEN }}

jobs:
  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-core.txt

      - name: Preflight ring repos
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::Missing DEEPREPO_PAT"; exit 1; }
          owner="${GITHUB_REPOSITORY%%/*}"
          fail=0
          for i in 1 2 3 4 5; do
            r="$owner/deeprepo-cpu-$i"
            if ! gh api "repos/$r" >/dev/null 2>&1; then
              echo "::error::missing repo $r (create it and push the stamped runner workflow)"; fail=1; continue
            fi
            if ! gh api "repos/$r/contents/.github/workflows/runner.yml" >/dev/null 2>&1; then
              echo "::error::$r has no .github/workflows/runner.yml"; fail=1; continue
            fi
            if ! gh api "repos/$r/actions/secrets" >/dev/null 2>&1; then
              echo "::warning::cannot list secrets on $r (needs admin); make sure DEEPREPO_PAT is set there"; 
            fi
            echo "ring slot $r ok"
          done
          exit $fail

      - name: Self-test every runner (dispatch + await)
        run: python -m deepcore sweep --op "${{ inputs.op }}" | tee sweep.json

      - name: Summary
        run: |
          echo "## Ring health" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat sweep.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
