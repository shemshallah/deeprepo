name: test fuse
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe FUSE
        run: |
          set -x
          ls -l /dev/fuse || true
          cat /proc/filesystems | grep -i fuse || true
          sudo modprobe fuse || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3 bindfs
          mkdir -p /tmp/fuse-src /tmp/fuse-dst
          echo hello-from-fuse > /tmp/fuse-src/x
          sudo bindfs /tmp/fuse-src /tmp/fuse-dst
          cat /tmp/fuse-dst/x
          mount | grep fuse
          fusermount3 -u /tmp/fuse-dst
