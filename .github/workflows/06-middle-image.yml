name: 06 middle image
# Builds the middleman/keeper image to GHCR so Koyeb (or any container host) can run it
# without a GitHub integration. Public repo -> make the package public in GitHub Packages
# if the host cannot authenticate to GHCR.
on:
  workflow_dispatch:
  push:
    paths:
      - "deepcore/**"
      - "Dockerfile"
      - ".github/workflows/06-middle-image.yml"
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-middle:latest
            ghcr.io/${{ github.repository }}-middle:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=deeprepo middleman and keeper
