name: RAM16 GGUF runner on Backblaze B2

on:
  workflow_dispatch:
    inputs:
      command:
        description: Operation
        required: true
        type: choice
        default: status
        options: [init, status, format-url, serve, commit, gc]
      model_url:
        description: Public HTTPS URL for the GGUF (format-url only)
        required: false
        type: string
      kv_mb:
        description: KV spill region size in MiB when formatting
        required: false
        default: "1024"
        type: string
      batch_pages:
        description: Pages per streaming commit (8 pages = 32 MiB)
        required: false
        default: "8"
        type: string
      restart_import:
        description: Abandon an existing import checkpoint and start from byte zero
        required: false
        default: false
        type: boolean
      minutes:
        description: Serve duration (GitHub runner maximum is 6 hours)
        required: false
        default: "330"
        type: string
      label:
        description: GitHub issue label to poll
        required: false
        default: ram16-chat
        type: string
      native_cache_pages:
        description: Native remote GGUF page cache (4 MiB per page; 8 = 32 MiB)
        required: false
        default: "8"
        type: string
      handoff:
        description: Dispatch another runner when this one finishes
        required: false
        default: false
        type: boolean
      apply_gc:
        description: Actually delete unreachable old B2 object versions (otherwise dry-run)
        required: false
        default: false
        type: boolean
      gc_min_age_days:
        description: Minimum object age before garbage collection
        required: false
        default: "7"
        type: string
      gc_retain_generations:
        description: Number of newest manifests to retain
        required: false
        default: "5"
        type: string

permissions:
  contents: read
  issues: write
  actions: write

# Serialize all writes to the B2 CURRENT register. Do not run a second writer
# from another repository or a local machine at the same time.
concurrency:
  group: ram16-b2-single-writer
  cancel-in-progress: false

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # All writers must be dispatched through this single repository. GitHub
      # concurrency groups are repository-scoped, not account-global.
      RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-b2.txt
      - name: Install B2 storage client
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-b2.txt
      - name: Build native B2-backed GGUF mmap filesystem
        if: inputs.command == 'serve'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfuse3-dev libcurl4-openssl-dev libssl-dev zlib1g-dev libboost-dev
          cmake -S native/ram16-gguf-fuse -B native/ram16-gguf-fuse/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/ram16-gguf-fuse/build --parallel 2
          test -x native/ram16-gguf-fuse/build/ram16-gguf-mount
          if [ ! -c /dev/fuse ]; then
            sudo modprobe fuse || true
          fi
          test -c /dev/fuse || { echo 'This runner does not expose /dev/fuse; native remote mmap cannot start.'; exit 1; }
      - name: Install llama.cpp Python inference binding
        if: inputs.command == 'serve'
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: python -m pip install 'llama-cpp-python>=0.3,<1'
      - name: Initialize B2 memory register
        if: inputs.command == 'init'
        env:
          RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: python ram16_b2.py init
      - name: Inspect memory and model layout
        if: inputs.command == 'status'
        env:
          RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: python ram16_b2.py status
      - name: Stream GGUF into B2-backed virtual memory
        if: inputs.command == 'format-url'
        env:
          RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          MODEL_URL: ${{ inputs.model_url }}
          KV_MB: ${{ inputs.kv_mb }}
          BATCH_PAGES: ${{ inputs.batch_pages }}
          RESTART_IMPORT: ${{ inputs.restart_import }}
        run: |
          test -n "$MODEL_URL" || { echo 'model_url is required'; exit 2; }
          ARGS=(format-url "$MODEL_URL" --kv-mb "$KV_MB" --batch-pages "$BATCH_PAGES")
          if [ "$RESTART_IMPORT" = "true" ]; then ARGS+=(--restart); fi
          python ram16_b2.py "${ARGS[@]}"
      - name: Run the original GGUF issue-chat agent
        if: inputs.command == 'serve'
        env:
          RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_READ_KEY_ID: ${{ secrets.B2_READ_KEY_ID }}
          B2_READ_APPLICATION_KEY: ${{ secrets.B2_READ_APPLICATION_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAM16_REPO: ${{ github.repository }}
          MINUTES: ${{ inputs.minutes }}
          CHAT_LABEL: ${{ inputs.label }}
          HANDOFF: ${{ inputs.handoff }}
          NATIVE_CACHE_PAGES: ${{ inputs.native_cache_pages }}
        run: |
          set -euo pipefail
          MOUNT_DIR=/tmp/ram16-b2-mount
          mkdir -p "$MOUNT_DIR"
          [[ "$NATIVE_CACHE_PAGES" =~ ^[0-9]+$ ]] && (( NATIVE_CACHE_PAGES >= 2 && NATIVE_CACHE_PAGES <= 128 )) || { echo 'native_cache_pages must be between 2 and 128'; exit 2; }
          native/ram16-gguf-fuse/build/ram16-gguf-mount "$MOUNT_DIR" --file model.gguf --cache-pages "$NATIVE_CACHE_PAGES" > /tmp/ram16-gguf-fuse.log 2>&1 &
          FUSE_PID=$!
          cleanup() {
            fusermount3 -u "$MOUNT_DIR" 2>/dev/null || sudo umount "$MOUNT_DIR" 2>/dev/null || true
            kill "$FUSE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for i in $(seq 1 90); do
            if mountpoint -q "$MOUNT_DIR" && test -r "$MOUNT_DIR/model.gguf"; then READY=1; break; fi
            if ! kill -0 "$FUSE_PID" 2>/dev/null; then cat /tmp/ram16-gguf-fuse.log; exit 1; fi
            sleep 2
          done
          if [ "$READY" != 1 ]; then cat /tmp/ram16-gguf-fuse.log; echo 'Timed out waiting for native B2 GGUF mount'; exit 1; fi
          export RAM16_GGUF_MOUNT_PATH="$MOUNT_DIR/model.gguf"
          ARGS=(serve --minutes "$MINUTES" --label "$CHAT_LABEL")
          if [ "$HANDOFF" = "true" ]; then ARGS+=(--handoff); fi
          python ram16_b2.py "${ARGS[@]}"
      - name: Commit staged pages
        if: inputs.command == 'commit'
        env:
          RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: python ram16_b2.py commit

      - name: Garbage-collect unreachable B2 objects (dry-run by default)
        if: inputs.command == 'gc'
        env:
          RAM16_COORDINATOR_REPO: ${{ vars.RAM16_COORDINATOR_REPO || github.repository }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          APPLY_GC: ${{ inputs.apply_gc }}
          MIN_AGE_DAYS: ${{ inputs.gc_min_age_days }}
          RETAIN_GENERATIONS: ${{ inputs.gc_retain_generations }}
        run: |
          ARGS=(gc --min-age-days "$MIN_AGE_DAYS" --retain-generations "$RETAIN_GENERATIONS")
          if [ "$APPLY_GC" = "true" ]; then ARGS+=(--apply); fi
          python ram16_b2.py "${ARGS[@]}"
